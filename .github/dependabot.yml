version: 2
updates:
  - package-ecosystem: maven
    directory: "/"
    ignore:
      # springdoc 3.x targets Spring Boot 4; lift this when the project moves to Boot 4.
      - dependency-name: "org.springdoc:*"
        update-types: ["version-update:semver-major"]
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    labels:
      - dependencies
      - java
    open-pull-requests-limit: 10

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 5
